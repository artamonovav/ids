name: CI

# Проверка фронтенда на push/PR: типы (tsc), тесты (vitest), сборка (vite build)
# на чистом окружении с frozen-lockfile — ловит незакоммиченные зависимости
# и битые импорты до релиза. Rust не нужен — полная сборка бинарников
# выполняется в release.yml по тегам v*.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run build
