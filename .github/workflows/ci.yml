name: CI

# Сборка фронтенда десктоп-приложения (Vite + React) на push/PR.
# Rust не нужен — полная сборка бинарников выполняется в release.yml.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
