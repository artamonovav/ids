name: Release (Tauri desktop)

# Кроссплатформенная сборка IDS desktop (Tauri 2) по тегу v*.
# Проект — ids-desktop/ (self-contained: фронтенд + src-tauri внутри).
# Запуск: git tag v0.1.0 && git push origin v0.1.0
# Артефакты (.msi/.exe-NSIS/.zip-portable на Windows, .app/.dmg на macOS,
# .deb/.AppImage на Linux) — в GitHub Release (черновик).
# Portable zip = сырой IDS.exe + README, без инсталлера (только Windows).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка ids-desktop/src-tauri
        id: tauri_exists
        shell: bash
        run: |
          if [ -f ids-desktop/src-tauri/tauri.conf.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ids-desktop/src-tauri не найден — сборка пропущена."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.tauri_exists.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.tauri_exists.outputs.exists == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tauri_exists.outputs.exists == 'true'

      - name: Linux system deps (webkit2gtk-4.1)
        if: steps.tauri_exists.outputs.exists == 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        if: steps.tauri_exists.outputs.exists == 'true'
        run: bun install --frozen-lockfile
        working-directory: ids-desktop

      - name: Generate icons (logo.svg -> tauri icon)
        if: steps.tauri_exists.outputs.exists == 'true'
        run: bash build-icons.sh
        working-directory: ids-desktop

      # Установить версию из git-тега (v0.1.2 → 0.1.2) во все конфиги,
      # которые Tauri использует для имени артефакта. Без этого .deb/.msi/.app
      # получали версию 0.1.0 из захардкоженного tauri.conf.json/Cargo.toml.
      - name: Set version from git tag
        if: steps.tauri_exists.outputs.exists == 'true'
        shell: bash
        working-directory: ids-desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' (v0.1.2 → 0.1.2)
          export VERSION="${VERSION#v}"
          echo "Setting version to: $VERSION"
          node -e '
          const fs = require("fs");
          const v = process.env.VERSION;
          if (!v) { console.error("VERSION env not set"); process.exit(1); }
          // tauri.conf.json — используется для имени .deb/.msi/.app
          let conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          conf.version = v;
          fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          // Cargo.toml [package] version — fallback, если tauri.conf.json version пуст
          let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          cargo = cargo.replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          // package.json — для консистентности
          let pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = v;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          console.log("Updated version to " + v);
          '
          echo "=== verify ==="
          grep -hE '"version"|^version' src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json

      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri_exists.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ids-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "IDS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

      # === Portable Windows build ===
      # Сырой .exe из target/release/ — без инсталлера, без записи в реестр, без
      # ярлыков в Start Menu. Tauri встраивает иконки/ресурсы в бинарник; внешних
      # DLL нет. Зависимость: WebView2 runtime (предустановлен на Win11; на Win10 —
      # https://developer.microsoft.com/microsoft-edge/webview2/).
      # На Linux уже есть .AppImage (тоже portable); на macOS — .app/.dmg.
      - name: Package portable Windows zip
        if: steps.tauri_exists.outputs.exists == 'true' && matrix.platform == 'windows-latest'
        shell: bash
        working-directory: ids-desktop
        run: |
          set -e
          # Сырой exe называется по имени Cargo-пакета (ids-desktop.exe),
          # НЕ по productName (IDS). productName используется только для
          # bundle-артефактов (msi/nsis), а raw binary берёт имя из
          # Cargo.toml [package] name. Авто-детект через glob — устойчив к
          # переименованию пакета.
          EXE=$(ls src-tauri/target/release/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then
            echo "::error::Portable exe не найден в src-tauri/target/release/"
            echo "Ожидался <cargo-package-name>.exe (Cargo.toml [package] name = ids-desktop)"
            ls -la src-tauri/target/release/ 2>/dev/null | grep -i '\.exe$' || true
            exit 1
          fi
          echo "Found portable exe: $EXE"
          STAGING="portable-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp "$EXE" "$STAGING/IDS.exe"
          printf '%s\n' \
            'IDS — Issue Documentation System (portable)' \
            '============================================' \
            '' \
            'Запуск: IDS.exe — без установки, без прав админа, без записи в реестр.' \
            'Можно с USB-флешки.' \
            '' \
            'Требования:' \
            '  • Windows 10/11 x64' \
            '  • WebView2 Runtime — предустановлен на Windows 11;' \
            '    на Windows 10 скачайте бесплатно:' \
            '    https://developer.microsoft.com/microsoft-edge/webview2/' \
            '' \
            'Данные пользователя (путь к папке проекта, конфиг):' \
            '  %APPDATA%\ru.nota.ids.desktop\' \
            '' \
            'Для инсталляции со ярлыками в Start Menu используйте' \
            'IDS-*-x64.msi или IDS-*-x64-setup.exe из этого же релиза.' \
            > "$STAGING/README-portable.txt"
          # cd в staging, чтобы в zip файлы легли в корень (без путей)
          ( cd "$STAGING" && 7z a "../IDS-${{ github.ref_name }}-portable-windows-x64.zip" IDS.exe README-portable.txt )
          echo "=== zip contents ==="
          7z l "IDS-${{ github.ref_name }}-portable-windows-x64.zip"

      - name: Upload portable zip to GitHub Release
        if: steps.tauri_exists.outputs.exists == 'true' && matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ids-desktop
        run: |
          # gh release upload добавляет файлы в существующий релиз (созданный
          # tauri-action как draft), не меняя draft/prerelease статус.
          # --clobber: перезаписать, если файл уже есть (идемпотентно при re-run).
          gh release upload "${{ github.ref_name }}" \
            "IDS-${{ github.ref_name }}-portable-windows-x64.zip" \
            --clobber
