name: Release (Tauri desktop)

# Кроссплатформенная сборка IDS desktop (Tauri 2) по тегу v*.
# Проект — ids-desktop/ (self-contained: фронтенд + src-tauri внутри).
# Запуск: git tag v0.1.0 && git push origin v0.1.0
# Артефакты (.msi/.exe, .app/.dmg, .deb/.AppImage) — в GitHub Release (черновик).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка ids-desktop/src-tauri
        id: tauri_exists
        shell: bash
        run: |
          if [ -f ids-desktop/src-tauri/tauri.conf.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ids-desktop/src-tauri не найден — сборка пропущена."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.tauri_exists.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.tauri_exists.outputs.exists == 'true'
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tauri_exists.outputs.exists == 'true'

      - name: Linux system deps (webkit2gtk-4.1)
        if: steps.tauri_exists.outputs.exists == 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        if: steps.tauri_exists.outputs.exists == 'true'
        run: bun install --frozen-lockfile
        working-directory: ids-desktop

      - name: Generate icons (logo.svg -> tauri icon)
        if: steps.tauri_exists.outputs.exists == 'true'
        run: bash build-icons.sh
        working-directory: ids-desktop

      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri_exists.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ids-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "IDS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
