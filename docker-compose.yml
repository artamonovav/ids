# SPAS Knowledge Base — Docker Compose
# Запускайте ОДНУ из служб dev/app (обе слушают порт 3000).

services:
  # --- Разработка с hot-reload ---
  dev:
    image: oven/bun:1
    working_dir: /app
    # next dev биндим на 0.0.0.0 — иначе в контейнере слушает 127.0.0.1 и недоступен с хоста
    command: sh -c "bun install --frozen-lockfile && ./node_modules/.bin/next dev -p 3000 -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - bun_cache:/root/.bun
    environment:
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    stdin_open: true
    tty: true

  # --- Production-сборка + запуск ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ids:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped

  # --- Десктоп-сборка Tauri (Rust уже ВНУТРИ образа) ---
  # Запуск: docker compose --profile tauri run --rm tauri
  # Внутри: bash tauri-skeleton/port.sh  (перенос ./src в ids-desktop + сборка)
  tauri:
    profiles: [tauri]
    build:
      context: .
      dockerfile: docker/tauri.Dockerfile
    working_dir: /app
    volumes:
      # исходники IDS (./src, ./public) + ids-desktop — доступны в контейнере:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./ids-desktop:/app/ids-desktop
      # кэш сборки Rust (тяжёлый) — отдельный том:
      - tauri_target:/app/ids-desktop/src-tauri/target
      - cargo_cache:/root/.cargo
    command: bash
    stdin_open: true
    tty: true

volumes:
  bun_cache:
  tauri_target:
  cargo_cache:
