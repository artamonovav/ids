# IDS — Docker Compose (сборка десктоп-приложения Tauri)

services:
  # --- Десктоп-сборка Tauri (Rust уже ВНУТРИ образа) ---
  # Запуск: docker compose --profile tauri run --rm tauri
  # Внутри: cd ids-desktop && bash build.sh
  tauri:
    profiles: [tauri]
    build:
      context: ./docker
      dockerfile: tauri.Dockerfile
    working_dir: /app
    volumes:
      - ./ids-desktop:/app/ids-desktop
      # кэш сборки Rust (тяжёлый) — отдельный том:
      - tauri_target:/app/ids-desktop/src-tauri/target
      - cargo_cache:/root/.cargo
    command: bash
    stdin_open: true
    tty: true

volumes:
  tauri_target:
  cargo_cache:
